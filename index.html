<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Custom Deck Builder</title>
    <!-- Exact same viewport + base styles as webpack-dev-server provides -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            height: 100%; 
            overflow: auto; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body { background: #f5f5f5; }
        #app { 
            min-height: 100vh; 
            position: relative; 
            padding: 20px; 
            margin: 0 auto;
            max-width: 1400px;
        }
        .unloaded-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #666;
            font-size: 18px;
            z-index: 999;
        }
    </style>
    <link rel="stylesheet" href="css/normalize.css">
</head>
<body>
   
    <script src="js/node_modules.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
