<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Custom Deck Builder</title>
    <link rel="stylesheet" href="css/normalize.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;  /* ← THIS KILLS SCROLL */
        }
        #app {
            width: 100%;
            height: 100vh;
            position: relative;
        }
        .unloaded-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 999;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script src="js/node_modules.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
